<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
    <link rel="stylesheet" href="styles/cards.css">
    <title>Build a Deck of Playing Cards | FCC Project</title>
</head>
<body>
    <div data-include="components/header.html"></div>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <span>A</span>
        <span>♠</span>
      </div>
      <div class="middle">
        <span>♠</span>
      </div>
      <div class="right">
        <span>A</span>
        <span>♠</span>
      </div>
    </div>

    <div class="card">
      <div class="left">
        <span>K</span>
        <span>♥</span>
      </div>
      <div class="middle">
        <span>♥</span>
        <span>♥</span>
      </div>
      <div class="right">
        <span>K</span>
        <span>♥</span>
      </div>
    </div>

    <div class="card">
      <div class="left">
        <span>Q</span>
        <span>♦</span>
      </div>
      <div class="middle">
        <span>♦</span>
        <span>♦</span>
        <span>♦</span>
      </div>
      <div class="right">
        <span>Q</span>
        <span>♦</span>
      </div>
    </div>

    <div class="card">
      <div class="left">
        <span>J</span>
        <span>♣</span>
      </div>
      <div class="middle">
        <span>♣</span>
        <span>♣</span>
      </div>
      <div class="right">
        <span>J</span>
        <span>♣</span>
      </div>
    </div>
  </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
